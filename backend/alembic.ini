[alembic]
script_location = alembic

# DB URL (can be overridden by env.py)
sqlalchemy.url = postgresql://din-esh-kumar:[Vectronyx%402025]@db.ynmmhgkarttzpayuxbqh.supabase.co:5432/din-esh-kumar


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
level = NOTSET
formatter = generic
args = (sys.stdout,)

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S