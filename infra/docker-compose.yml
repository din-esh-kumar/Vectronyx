services:
  backend:
    build: ../backend
    container_name: vectronyx_backend
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    volumes:
      - ../backend:/app
    restart: always

  frontend:
    build: ../frontend
    container_name: vectronyx_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: pnpm run dev -- --host
    restart: always