name: Vectronyx CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  PYTHONUNBUFFERED: "1"

jobs:
  backend:
    name: Backend CI (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate Python syntax
        run: |
          python -m compileall -q backend/app backend/tests scripts

      - name: Run test suite
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-test-secret-key-32-chars-long!
        run: |
          cd backend
          python -m pytest -v --tb=short

      - name: Fast secret leak audit
        run: |
          echo "Scanning tracked client files for potential secrets..."
          python -c '
          import re, sys, os
          pattern = re.compile(r"""(?:AIzaSy|sk-proj-|nvapi-|ghp_|gho_|xox[baprs]-|sq0csp-)[\w-]{16,}""")
          violations = []
          for root, _, files in os.walk("frontend/src"):
              for f in files:
                  if f.endswith((".ts", ".tsx", ".js", ".jsx", ".json")):
                      path = os.path.join(root, f)
                      with open(path, "r", encoding="utf-8", errors="ignore") as fp:
                          for line_no, line in enumerate(fp, 1):
                              if pattern.search(line):
                                  violations.append(f"{path}:{line_no}")
          if violations:
              print(f"FAILED: Found potential secrets in frontend source: {violations}", file=sys.stderr)
              sys.exit(1)
          print("PASSED: Zero secrets detected in client source.")
          '

  frontend:
    name: Frontend CI (Node 20 & Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm --dir frontend run typecheck

      - name: Vite production build
        run: pnpm --dir frontend run build

  deploy:
    name: Continuous Delivery
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy backend to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID_VAR: ${{ vars.HF_SPACE_ID }}
          HF_SPACE_ID_SEC: ${{ secrets.HF_SPACE_ID }}
          HF_SPACE_SDK_VAR: ${{ vars.HF_SPACE_SDK }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          NVIDIA_BASE_URL: ${{ vars.NVIDIA_BASE_URL }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
        run: |
          echo "=========================================="
          echo "Vectronyx CI/CD: Pipeline Verified Clean"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"
          echo "=========================================="
          if [ -n "$HF_TOKEN" ]; then
            SPACE_ID="${HF_SPACE_ID_VAR:-${HF_SPACE_ID_SEC:-din-esh-kumar/vectronyx-backend}}"
            SPACE_SDK="${HF_SPACE_SDK_VAR:-gradio}"
            echo "Deploying backend to HuggingFace Space: $SPACE_ID (sdk=$SPACE_SDK)..."
            pip install huggingface_hub python-dotenv
            python scripts/deploy_hf_space.py --space-id "$SPACE_ID" --sdk "$SPACE_SDK" --sync-ci-env --wait --wait-timeout 240
          else
            echo "No HF_TOKEN secret configured in GitHub Actions; skipping remote push to Space."
          fi
