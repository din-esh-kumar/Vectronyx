name: Vectronyx CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Components to deploy after CI passes"
        type: choice
        default: all
        options:
          - all
          - backend
          - frontend
          - none
      environment:
        description: "Target deployment environment"
        type: choice
        default: production
        options:
          - production
          - staging
      run_migrations:
        description: "Run Alembic database migrations before backend deploy (requires DATABASE_URL secret)"
        type: boolean
        default: false
      skip_post_deploy_verify:
        description: "Skip post-deploy live smoke & contract verification"
        type: boolean
        default: false

concurrency:
  group: vectronyx-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  PNPM_VERSION: "9.12.2"
  VERCEL_CLI_VERSION: "66.1.0"

jobs:
  # ============================================================================
  # 1. Security, Secret & Configuration Validation Gate
  # ============================================================================
  secret-scan:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Scan tracked files for leaked secrets & forbidden client env vars
        run: python scripts/ci_secret_scan.py

      - name: Validate JSON & YAML deployment manifests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          json_files = [
              "package.json",
              "frontend/package.json",
              "vercel.json",
              "frontend/vercel.json",
              "railway.json",
              "pyrightconfig.json",
          ]
          for rel in json_files:
              p = Path(rel)
              if p.is_file():
                  json.loads(p.read_text(encoding="utf-8"))
                  print(f"[OK] Valid JSON: {rel}")
          PY

  # ============================================================================
  # 2. Frontend CI — Typecheck, Production Build, Bundle Budget & Secret Audit
  # ============================================================================
  frontend-ci:
    name: Frontend CI (Typecheck, Build & Bundle Audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm --dir frontend run typecheck

      - name: Build production Vite bundle
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://din-esh-kumar-vectronyx-backend.hf.space' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || '' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || '' }}
          VITE_GEMINI_MODEL: ${{ vars.VITE_GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          VITE_GROQ_MODEL: ${{ vars.VITE_GROQ_MODEL || 'openai/gpt-oss-120b' }}
        run: pnpm --dir frontend run build

      - name: Audit built JS bundle for leaked secrets
        run: python3 scripts/ci_secret_scan.py --paths frontend/dist

      - name: Bundle size report & budget check
        run: |
          python3 - <<'PY'
          import gzip
          import os
          from pathlib import Path

          dist = Path("frontend/dist")
          assets = sorted(
              (p for p in dist.rglob("*") if p.is_file() and p.suffix in {".js", ".css"}),
              key=lambda p: p.stat().st_size,
              reverse=True,
          )
          total_raw = sum(p.stat().st_size for p in assets)
          total_gz = sum(len(gzip.compress(p.read_bytes())) for p in assets)

          lines = [
              "### Frontend Production Bundle Report",
              f"- **Total JS/CSS**: {total_raw / 1024:.1f} KiB raw / {total_gz / 1024:.1f} KiB gzip",
              "",
              "| Asset | Raw Size | Gzip Size |",
              "|---|---:|---:|",
          ]
          for asset in assets[:10]:
              raw_kb = asset.stat().st_size / 1024
              gz_kb = len(gzip.compress(asset.read_bytes())) / 1024
              rel = asset.relative_to(dist).as_posix()
              lines.append(f"| `{rel}` | {raw_kb:.1f} KiB | {gz_kb:.1f} KiB |")
              if raw_kb > 1024:
                  print(f"::warning::Chunk {rel} exceeds 1 MiB raw ({raw_kb:.1f} KiB)")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as fh:
                  fh.write("\n".join(lines) + "\n\n")
          print("\n".join(lines))
          PY

      - name: Upload built frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist
          retention-days: 5

  # ============================================================================
  # 3. Backend CI — Lint, Compile, Migration Integrity & Offline Test Suite
  # ============================================================================
  backend-ci:
    name: Backend CI (Lint, Compile, Migrations & Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies & Ruff linter
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install --no-cache-dir ruff pyyaml

      - name: Critical static analysis (Ruff syntax & undefined symbols)
        run: ruff check --select E9,F63,F7,F82 backend/app backend/space_app.py scripts

      - name: Bytecode compile backend and DevOps scripts
        run: python -m compileall -q backend/app backend/space_app.py scripts

      - name: Verify Alembic single-head migration graph
        run: |
          cd backend
          HEADS_OUT=$(alembic heads)
          echo "$HEADS_OUT"
          HEAD_COUNT=$(echo "$HEADS_OUT" | grep -c "(head)" || true)
          if [ "$HEAD_COUNT" -ne 1 ]; then
            echo "::error::Expected exactly 1 Alembic migration head, found $HEAD_COUNT. Merge divergent branches with 'alembic merge heads'."
            exit 1
          fi

      - name: Run deterministic offline pytest suite with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          ENVIRONMENT: test
          GEMINI_API_KEY: ""
          GROQ_API_KEY: ""
          DATABASE_URL: ""
          SUPABASE_URL: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
          SUPABASE_PUBLISHABLE_KEY: ""
          SECRET_KEY: "ci-offline-verification-secret"
        run: |
          pytest \
            backend/tests/test_ci_smoke.py \
            backend/tests/test_principal_refiner_and_pbip.py \
            backend/tests/test_data_analyst_prompt_driven.py \
            backend/tests/test_data_analyst_api_e2e.py \
            backend/tests/test_instructor_stress.py \
            backend/tests/test_instructor_structured.py \
            backend/tests/test_sse_streaming.py \
            -k "not test_web_search_args_validation and not test_stream_research_agent_with_data_analyst_tool and not test_research_sse_event_stream" \
            --cov=app \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:backend/coverage.xml \
            --junitxml=backend/junit.xml \
            -v

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-${{ github.sha }}
          path: |
            backend/junit.xml
            backend/coverage.xml
          retention-days: 14
          if-no-files-found: ignore

  # ============================================================================
  # 4. Pull Request Preview Deployment (Vercel — optional if secrets present)
  # ============================================================================
  preview-vercel:
    name: PR Preview Deploy (Vercel)
    needs: [secret-scan, frontend-ci]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build & deploy Vercel Preview
        id: preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice::Vercel CLI secrets not configured — skipping CI preview deploy (Vercel Git integration handles PR previews natively)."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          npm install -g "vercel@${VERCEL_CLI_VERSION}"
          vercel pull --yes --environment=preview
          vercel build
          if [ -d ".vercel/output/static" ]; then
            python3 scripts/ci_secret_scan.py --paths .vercel/output/static
          elif [ -d "frontend/.vercel/output/static" ]; then
            python3 scripts/ci_secret_scan.py --paths frontend/.vercel/output/static
          fi
          PREVIEW_URL=$(vercel deploy --prebuilt --yes)
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Post or update PR preview comment
        if: steps.preview.outputs.deployed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- vectronyx-vercel-preview -->';
            const url = '${{ steps.preview.outputs.url }}';
            const sha = '${{ github.event.pull_request.head.sha }}'.slice(0, 7);
            const body = [
              marker,
              '### Vectronyx Preview Deployment Ready',
              '',
              `- **Preview URL**: ${url}`,
              `- **Commit**: \`${sha}\``,
              `- **Security & Bundle Audit**: Passed`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ============================================================================
  # 5. Pre-Deploy Database Migrations (Alembic — opt-in via input or repo var)
  # ============================================================================
  db-migrate:
    name: Database Migrations (Alembic)
    needs: [secret-scan, frontend-ci, backend-ci]
    if: >-
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AUTO_RUN_MIGRATIONS == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.run_migrations == true)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.environment || 'production' }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install migration dependencies
        run: pip install --no-cache-dir alembic sqlalchemy psycopg2-binary python-dotenv pydantic pydantic-settings

      - name: Run Alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set. Add DATABASE_URL to GitHub Secrets to run automated migrations."
            exit 1
          fi
          echo "::add-mask::$DATABASE_URL"
          cd backend
          alembic current
          alembic upgrade head
          alembic current

  # ============================================================================
  # 6. Auto-Deploy Backend — Hugging Face Spaces (+ optional Render Hook)
  # ============================================================================
  deploy-backend:
    name: Auto-Deploy Backend (HF Spaces)
    needs: [secret-scan, frontend-ci, backend-ci, db-migrate]
    if: >-
      always() &&
      needs.secret-scan.result == 'success' &&
      needs.frontend-ci.result == 'success' &&
      needs.backend-ci.result == 'success' &&
      (needs.db-migrate.result == 'success' || needs.db-migrate.result == 'skipped') &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && (inputs.deploy_target == 'all' || inputs.deploy_target == 'backend'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment || 'production' }}
      url: ${{ steps.hf_deploy.outputs.backend_url }}
    permissions:
      contents: read
    outputs:
      backend_url: ${{ steps.hf_deploy.outputs.backend_url }}
      space_id: ${{ steps.hf_deploy.outputs.space_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Hugging Face Hub SDK
        run: pip install --no-cache-dir "huggingface_hub>=0.26.0"

      - name: Deploy backend/ to Hugging Face Space and await readiness
        id: hf_deploy
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID || 'din-esh-kumar/vectronyx-backend' }}
          HF_SPACE_SDK: ${{ vars.HF_SPACE_SDK || 'gradio' }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN repository secret is not set. Add HF_TOKEN in GitHub Settings -> Secrets and variables -> Actions -> Secrets."
            {
              echo "### Hugging Face Space Auto-Deploy Blocked"
              echo "- Add **\`HF_TOKEN\`** (Hugging Face Write token) in **Settings -> Secrets and variables -> Actions -> Secrets**."
              echo "- Optional variable: **\`HF_SPACE_ID\`** (defaults to \`din-esh-kumar/vectronyx-backend\`)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          BACKEND_URL=$(python -c "import os, re; o, n = os.environ['HF_SPACE_ID'].split('/', 1); print(f'https://{re.sub(r\"[^a-z0-9-]\", \"-\", o.lower())}-{re.sub(r\"[^a-z0-9-]\", \"-\", n.lower())}.hf.space')")
          echo "space_id=$HF_SPACE_ID" >> "$GITHUB_OUTPUT"
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"

          python scripts/deploy_hf_space.py \
            --space-id "$HF_SPACE_ID" \
            --sdk "$HF_SPACE_SDK" \
            --wait \
            --wait-timeout 300

          {
            echo "### Backend Auto-Deploy (Hugging Face Spaces)"
            echo "- **Environment**: \`${{ inputs.environment || 'production' }}\`"
            echo "- **Space**: [\`$HF_SPACE_ID\`](https://huggingface.co/spaces/$HF_SPACE_ID) (\`$HF_SPACE_SDK\`)"
            echo "- **API URL**: $BACKEND_URL"
            echo "- **Health Probe**: $BACKEND_URL/health"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger optional Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not configured — skipping secondary Render trigger."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Triggered Render secondary backend deployment."

  # ============================================================================
  # 7. Auto-Deploy Frontend — Vercel Staged Build -> Smoke Test -> Promote
  # ============================================================================
  deploy-frontend:
    name: Auto-Deploy Frontend (Vercel)
    needs: [secret-scan, frontend-ci, backend-ci]
    if: >-
      always() &&
      needs.secret-scan.result == 'success' &&
      needs.frontend-ci.result == 'success' &&
      needs.backend-ci.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && (inputs.deploy_target == 'all' || inputs.deploy_target == 'frontend'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment || 'production' }}
      url: ${{ steps.vercel_deploy.outputs.frontend_url }}
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.vercel_deploy.outputs.mode }}
      frontend_url: ${{ steps.vercel_deploy.outputs.frontend_url }}
      staged_url: ${{ steps.vercel_deploy.outputs.staged_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Staged Vercel build, pre-cutover verification & atomic promote
        id: vercel_deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          FALLBACK_FRONTEND_URL: ${{ vars.FRONTEND_URL || 'https://vectronyx.vercel.app' }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice::VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID not all set — relying on Vercel native GitHub main auto-deploy."
            echo "mode=git-integration" >> "$GITHUB_OUTPUT"
            echo "frontend_url=$FALLBACK_FRONTEND_URL" >> "$GITHUB_OUTPUT"
            echo "staged_url=" >> "$GITHUB_OUTPUT"
            {
              echo "### Frontend Auto-Deploy (Vercel Git Integration)"
              echo "- Vercel CLI secrets are not set, so production builds run via Vercel's native GitHub \`main\` integration."
              echo "- **Production URL**: $FALLBACK_FRONTEND_URL"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          npm install -g "vercel@${VERCEL_CLI_VERSION}"
          vercel pull --yes --environment=production
          vercel build --prod

          if [ -d ".vercel/output/static" ]; then
            python3 scripts/ci_secret_scan.py --paths .vercel/output/static
          elif [ -d "frontend/.vercel/output/static" ]; then
            python3 scripts/ci_secret_scan.py --paths frontend/.vercel/output/static
          fi

          # Stage production deployment without assigning custom domain yet
          STAGED_URL=$(vercel deploy --prebuilt --prod --skip-domain --yes | tail -n 1 | tr -d '\r')
          echo "Staged deployment URL: $STAGED_URL"

          # Verify staged production build before promoting traffic
          python3 scripts/verify_deployment.py \
            --frontend-only \
            --frontend-url "$STAGED_URL" \
            --wait-seconds 30 \
            --title "Staged Pre-Promote Frontend Verification"

          # Atomic zero-downtime promotion to production domain
          vercel promote "$STAGED_URL" --yes

          echo "mode=cli-staged-promote" >> "$GITHUB_OUTPUT"
          echo "staged_url=$STAGED_URL" >> "$GITHUB_OUTPUT"
          echo "frontend_url=$FALLBACK_FRONTEND_URL" >> "$GITHUB_OUTPUT"

          {
            echo "### Frontend Auto-Deploy (Vercel Staged -> Verified -> Promoted)"
            echo "- **Staged Build**: $STAGED_URL"
            echo "- **Production Domain**: $FALLBACK_FRONTEND_URL"
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # 8. Post-Deploy Live Smoke, Contract & Latency Verification
  # ============================================================================
  post-deploy-verify:
    name: Post-Deploy Live Verification
    needs: [deploy-backend, deploy-frontend]
    if: >-
      always() &&
      !(github.event_name == 'workflow_dispatch' && inputs.skip_post_deploy_verify) &&
      (needs.deploy-backend.result == 'success' || needs.deploy-frontend.result == 'success') &&
      needs.deploy-backend.result != 'failure' &&
      needs.deploy-frontend.result != 'failure' &&
      needs.deploy-backend.result != 'cancelled' &&
      needs.deploy-frontend.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify live production backend & frontend contracts
        env:
          BACKEND_DEPLOYED: ${{ needs.deploy-backend.result == 'success' }}
          FRONTEND_DEPLOYED: ${{ needs.deploy-frontend.result == 'success' }}
          BACKEND_URL: ${{ needs.deploy-backend.outputs.backend_url }}
          FRONTEND_URL: ${{ needs.deploy-frontend.outputs.frontend_url || vars.FRONTEND_URL || 'https://vectronyx.vercel.app' }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID || 'din-esh-kumar/vectronyx-backend' }}
          VERCEL_DEPLOY_MODE: ${{ needs.deploy-frontend.outputs.mode }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          WAIT_SECS=30
          if [ "$VERCEL_DEPLOY_MODE" = "git-integration" ]; then
            WAIT_SECS=120
          fi

          ARGS=(--wait-seconds "$WAIT_SECS" --json-out deploy-verification.json --title "Production Post-Deploy Verification")
          if [ "$BACKEND_DEPLOYED" = "true" ] && [ "$FRONTEND_DEPLOYED" = "true" ]; then
            ARGS+=(--backend-url "$BACKEND_URL" --frontend-url "$FRONTEND_URL")
          elif [ "$BACKEND_DEPLOYED" = "true" ]; then
            ARGS+=(--backend-only --backend-url "$BACKEND_URL" --frontend-url "$FRONTEND_URL")
          else
            ARGS+=(--frontend-only --frontend-url "$FRONTEND_URL")
          fi

          python3 scripts/verify_deployment.py "${ARGS[@]}"

      - name: Upload verification scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-verification-${{ github.sha }}
          path: deploy-verification.json
          retention-days: 14
          if-no-files-found: ignore

  # ============================================================================
  # 9. Optional Deployment Notification Webhook (Slack / Discord / Generic)
  # ============================================================================
  notify-deploy:
    name: Deployment Status Notification
    needs: [deploy-backend, deploy-frontend, post-deploy-verify]
    if: >-
      always() &&
      (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Send webhook notification if DEPLOY_WEBHOOK_URL is configured
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          BACKEND_STATUS: ${{ needs.deploy-backend.result }}
          FRONTEND_STATUS: ${{ needs.deploy-frontend.result }}
          VERIFY_STATUS: ${{ needs.post-deploy-verify.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "DEPLOY_WEBHOOK_URL secret not set — skipping external notification."
            exit 0
          fi
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          ok = all(
              os.environ[k] in ("success", "skipped")
              for k in ("BACKEND_STATUS", "FRONTEND_STATUS", "VERIFY_STATUS")
          )
          status_label = "SUCCEEDED" if ok else "FAILED"
          short_sha = os.environ["COMMIT_SHA"][:7]
          text = (
              f"Vectronyx Deployment {status_label} (`{short_sha}`)\n"
              f"- Backend: {os.environ['BACKEND_STATUS']}\n"
              f"- Frontend: {os.environ['FRONTEND_STATUS']}\n"
              f"- Verification: {os.environ['VERIFY_STATUS']}\n"
              f"- Run: {os.environ['RUN_URL']}"
          )
          # Compatible with both Slack (`text`) and Discord (`content`) webhooks
          payload = json.dumps({"text": text, "content": text}).encode("utf-8")
          req = urllib.request.Request(
              os.environ["DEPLOY_WEBHOOK_URL"],
              data=payload,
              headers={"Content-Type": "application/json", "User-Agent": "Vectronyx-CI/2.0"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=10) as resp:
              print(f"Webhook delivered: HTTP {resp.status}")
          PY
