name: Production Health Monitor & Keep-Alive

on:
  schedule:
    # Probe every 6 hours: verifies production health & prevents HF Spaces 48h inactivity sleep
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      open_issue_on_failure:
        description: "Open or update a GitHub incident issue if health check fails"
        type: boolean
        default: true

concurrency:
  group: vectronyx-uptime-monitor
  cancel-in-progress: false

permissions: {}

jobs:
  synthetic-health-check:
    name: Synthetic Production Health & Keep-Alive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Probe live backend (HF Spaces) & frontend (Vercel)
        id: probe
        continue-on-error: true
        env:
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID || 'din-esh-kumar/vectronyx-backend' }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL || 'https://vectronyx.vercel.app' }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          python3 scripts/verify_deployment.py \
            --hf-space-id "$HF_SPACE_ID" \
            --frontend-url "$FRONTEND_URL" \
            --wait-seconds 45 \
            --timeout 25 \
            --json-out health-report.json \
            --title "Scheduled Production Health & Keep-Alive Check"

      - name: Manage GitHub Incident Issue lifecycle
        if: github.event_name == 'schedule' || inputs.open_issue_on_failure == true
        uses: actions/github-script@v9
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const outcome = process.env.PROBE_OUTCOME;
            const runUrl = process.env.RUN_URL;
            const issueTitle = '[Production Incident] Vectronyx synthetic health check failing';

            // Ensure incident labels exist (ignore errors if already created)
            for (const label of [
              { name: 'incident', color: 'b60205', description: 'Live production outage or degradation' },
              { name: 'production', color: 'd93f0b', description: 'Production environment issue' },
            ]) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...label,
                });
              } catch (_) {}
            }

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'incident',
            });
            const existing = openIssues.find(i => i.title === issueTitle);

            let reportSummary = 'No JSON report generated.';
            if (fs.existsSync('health-report.json')) {
              const items = JSON.parse(fs.readFileSync('health-report.json', 'utf8'));
              const rows = items.map(
                r => `| \`${r.target}\` | \`${r.check}\` | **${r.ok ? 'PASS' : (r.severity === 'warning' ? 'WARN' : 'FAIL')}** | ${Math.round(r.latency_ms)} ms | ${r.detail} |`
              );
              reportSummary = [
                '| Target | Check | Status | Latency | Details |',
                '|---|---|---|---:|---|',
                ...rows,
              ].join('\n');
            }

            if (outcome !== 'success') {
              const body = [
                '### Automated Production Health Alert',
                '',
                `- **Timestamp (UTC)**: ${new Date().toISOString()}`,
                `- **Workflow Run**: ${runUrl}`,
                '',
                reportSummary,
              ].join('\n');

              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `Still failing at ${new Date().toISOString()}.\n\n${body}`,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: issueTitle,
                  labels: ['incident', 'production'],
                  body,
                });
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `### Production Recovered\n\nAll synthetic checks passed at ${new Date().toISOString()}.\n\n- **Run**: ${runUrl}\n\n${reportSummary}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
              });
            }

      - name: Send outage webhook alert if configured
        if: steps.probe.outcome != 'success'
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            exit 0
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          text = f"ALERT: Vectronyx production health check FAILED!\nInspect run: {os.environ['RUN_URL']}"
          payload = json.dumps({"text": text, "content": text}).encode("utf-8")
          req = urllib.request.Request(
              os.environ["DEPLOY_WEBHOOK_URL"],
              data=payload,
              headers={"Content-Type": "application/json", "User-Agent": "Vectronyx-Monitor/2.0"},
              method="POST",
          )
          urllib.request.urlopen(req, timeout=10).read()
          PY

      - name: Fail workflow if synthetic health check failed
        if: steps.probe.outcome != 'success'
        run: exit 1
