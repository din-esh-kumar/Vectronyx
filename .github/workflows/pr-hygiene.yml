name: PR Governance & Auto-Labeler

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: vectronyx-pr-hygiene-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  pr-checks:
    name: Conventional PR Title & Diff Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Conventional Commit PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os, re, sys

          title = os.environ["PR_TITLE"].strip()
          pattern = re.compile(
              r"^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|security)(\([a-z0-9._/-]+\))?!?:\s+.+"
          )
          if not pattern.match(title):
              print(
                  f"::error::PR title '{title}' does not follow Conventional Commits.\n"
                  "Expected format: <type>(<optional-scope>): <description>\n"
                  "Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert, security",
                  file=sys.stderr,
              )
              sys.exit(1)
          print(f"[OK] Valid Conventional Commit title: {title}")
          PY

      - name: Auto-label PR by changed paths
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/labeler@v7
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

      - name: Report PR diff size in summary
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const total = (pr.additions || 0) + (pr.deletions || 0);
            const size =
              total < 100 ? 'XS' :
              total < 300 ? 'S' :
              total < 750 ? 'M' :
              total < 1500 ? 'L' : 'XL';
            await core.summary
              .addHeading('PR Hygiene Summary', 3)
              .addList([
                `Title: \`${pr.title}\``,
                `Changed files: **${pr.changed_files}** (+${pr.additions} / -${pr.deletions})`,
                `Estimated review size: **${size}**`,
              ])
              .write();
            if (size === 'XL') {
              core.warning(`Large PR detected (${total} changed lines). Consider splitting into smaller reviewable PRs.`);
            }
