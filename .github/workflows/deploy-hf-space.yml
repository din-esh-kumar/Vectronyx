name: Deploy Backend to Hugging Face Space

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-hf-space.yml"
  workflow_dispatch:

jobs:
  deploy-hf-space:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install huggingface_hub CLI
        run: pip install --no-cache-dir "huggingface_hub>=0.26.0"

      - name: Push backend/ to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE_ID" ]; then
            echo "Error: HF_TOKEN secret and HF_SPACE_ID repository variable must be set."
            exit 1
          fi
          python -c "
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ['HF_TOKEN'])
          space_id = os.environ['HF_SPACE_ID']
          api.create_repo(
              repo_id=space_id,
              repo_type='space',
              space_sdk='docker',
              exist_ok=True,
          )
          api.upload_folder(
              folder_path='backend',
              repo_id=space_id,
              repo_type='space',
              commit_message='Deploy Vectronyx backend from GitHub Actions',
              ignore_patterns=[
                  '**/__pycache__/**',
                  '**/__pycache__',
                  '**/*.pyc',
                  '**/*.pyo',
                  '.venv/**',
                  'venv/**',
                  '.pytest_cache/**',
                  '**/.pytest_cache/**',
                  'tests/**',
                  '.env*',
              ],
              delete_patterns=['*'],
          )
          print(f'Successfully deployed to https://huggingface.co/spaces/{space_id}')
          "

