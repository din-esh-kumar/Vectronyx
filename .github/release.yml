changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: "Breaking Changes"
      labels:
        - breaking-change
    - title: "New Features"
      labels:
        - enhancement
        - feature
    - title: "Bug Fixes"
      labels:
        - bug
        - fix
    - title: "Security Hardening"
      labels:
        - security
    - title: "DevOps, CI/CD & Infrastructure"
      labels:
        - devops
        - docker
        - database
    - title: "Documentation"
      labels:
        - docs
    - title: "Dependency Updates"
      labels:
        - dependencies
    - title: "Other Changes"
      labels:
        - "*"
